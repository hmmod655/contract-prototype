<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة مراجعة العقود</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@600;700&family=Montserrat:wght@500;600&display=swap">
<style>
/* Layout: sticky brand header + section tabs; workspace = role strip, module rail, content; rose footer bar. */
:root{
  --bg:#F5EFE6;--surface:#FBF8F3;--sunk:#EFE5D7;--ink:#4A2C1A;--ink2:#6B4C38;--muted:#866B58;
  --rose:#B07A5A;--rose2:#C49A78;--taupe:#D4B896;--line:#E3D3BD;--onrose:#FFFFFF;--hi:#F3E7D6;
  --ok:#4F6F3A;--okbg:#E4EAD6;--warn:#8E6114;--warnbg:#F4E6C6;--bad:#9C3B2A;--badbg:#F3DBD3;
  --plum:#734F70;--plumbg:#EBDDE8;--info:#6B4C38;--infobg:#EADCC9;--fut:#857767;--futbg:#E7E0D6;
  --ins:#E2EAD3;--del:#F2D9D1;
  --f-ar:'IBM Plex Sans Arabic',Tajawal,'Segoe UI',Tahoma,sans-serif;
  --f-disp:'Noto Naskh Arabic','IBM Plex Sans Arabic',serif;
  --f-en:Montserrat,'Segoe UI',Arial,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1510;--surface:#261C16;--sunk:#2F241C;--ink:#F1E5D6;--ink2:#D8C4AF;--muted:#AE957F;
  --rose:#B07A5A;--rose2:#C9926E;--taupe:#5B4636;--line:#3A2C22;--onrose:#FFFFFF;--hi:#33271E;
  --ok:#A9C58F;--okbg:#29331F;--warn:#E3B868;--warnbg:#3A2E18;--bad:#EA9584;--badbg:#3E221C;
  --plum:#D3AECF;--plumbg:#35253A;--info:#D8C4AF;--infobg:#33271E;--fut:#A99A8B;--futbg:#2C241E;
  --ins:#2B3622;--del:#43261F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1510;--surface:#261C16;--sunk:#2F241C;--ink:#F1E5D6;--ink2:#D8C4AF;--muted:#AE957F;
  --rose:#B07A5A;--rose2:#C9926E;--taupe:#5B4636;--line:#3A2C22;--onrose:#FFFFFF;--hi:#33271E;
  --ok:#A9C58F;--okbg:#29331F;--warn:#E3B868;--warnbg:#3A2E18;--bad:#EA9584;--badbg:#3E221C;
  --plum:#D3AECF;--plumbg:#35253A;--info:#D8C4AF;--infobg:#33271E;--fut:#A99A8B;--futbg:#2C241E;
  --ins:#2B3622;--del:#43261F;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ar);font-size:15px;line-height:1.65;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;text-wrap:balance;color:var(--ink)}
h1,h2{font-family:var(--f-disp);font-weight:700}
h3{font-size:1.05rem;font-weight:700}
h4{font-size:.95rem;font-weight:600}
p{margin:0}
a{color:var(--rose)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brandtitle{display:flex;flex-direction:column;min-width:0;flex:1}
.brandtitle h1{font-size:1.3rem;line-height:1.3}
.brandtitle .en{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.logo{height:38px;width:auto;color:var(--ink);flex:none}
.proto{font-size:.75rem;border:1px dashed var(--rose);color:var(--rose);border-radius:999px;padding:2px 10px;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;white-space:nowrap;color:var(--ink2);font-weight:500}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--rose);font-weight:700}
.tabs .tn{display:inline-block;font-size:.7rem;color:var(--muted);margin-inline-start:6px}

main{padding-block:24px 40px;min-height:60vh}
.foot{background:var(--rose);color:var(--onrose)}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.foot .mark{font-family:var(--f-en);letter-spacing:.3em;font-weight:600;font-size:.82rem}
.foot small{opacity:.9}

/* common */
.sec-title{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.sec-title h2{font-size:1.55rem}
.sec-title .en{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.divider{display:flex;align-items:center;gap:10px;color:var(--taupe);margin:6px 0}
.divider::before,.divider::after{content:"";height:1px;background:var(--taupe);flex:1}
.lead{color:var(--ink2);max-width:72ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.sunk{background:var(--sunk)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.xs{font-size:.76rem}
.b{font-weight:700}
.sp{flex:1}
.hr{height:1px;background:var(--line);margin:4px 0}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:600;white-space:nowrap;line-height:1.7}
.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-bad{background:var(--badbg);color:var(--bad)}
.t-plum{background:var(--plumbg);color:var(--plum)}.t-info{background:var(--infobg);color:var(--info)}.t-neutral{background:var(--sunk);color:var(--ink2)}
.t-fut{background:var(--futbg);color:var(--fut);border:1px dashed var(--fut)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:.74rem;color:var(--ink2);background:var(--surface)}
.req{font-family:var(--f-en);font-size:.68rem;color:var(--rose);border:1px solid var(--rose2);border-radius:4px;padding:0 5px;white-space:nowrap;background:none;cursor:pointer}
.btn{border:1px solid var(--taupe);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 14px;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--rose)}
.btn.pri{background:var(--rose);border-color:var(--rose);color:var(--onrose)}
.btn.pri:hover{filter:brightness(.95)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--rose)}
.btn[disabled],.btn.dis{opacity:.45;cursor:not-allowed}
.note{border-inline-start:3px solid var(--rose);background:var(--hi);padding:10px 12px;border-radius:0 6px 6px 0;font-size:.88rem}
.note.warn{border-color:var(--warn);background:var(--warnbg)}
.note.bad{border-color:var(--bad);background:var(--badbg)}
.note.fut{border-color:var(--fut);background:var(--futbg)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{background:var(--ink);color:var(--bg);font-weight:600;text-align:start;padding:9px 10px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hi)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:.82rem;color:var(--muted)}
.empty{border:1px dashed var(--taupe);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--rose)}

/* hero */
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:28px 24px}
.hero .motif{position:absolute;inset-inline-end:-30px;bottom:-40px;width:300px;height:300px;color:var(--taupe);opacity:.5;pointer-events:none}
.hero h2{font-size:clamp(1.5rem,3.2vw,2.2rem);line-height:1.35}
.hero .inner{position:relative;display:flex;flex-direction:column;gap:12px;max-width:820px}

/* phases */
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.phase{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.phase .pn{font-family:var(--f-en);font-size:.7rem;color:var(--rose);letter-spacing:.12em;text-transform:uppercase}
.phase.fut{border-style:dashed;background:var(--futbg)}

/* swimlane */
.lane-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.lane{display:grid;min-width:max-content;font-size:.8rem}
.lane .lh{position:sticky;inset-inline-start:0;z-index:2;background:var(--sunk);padding:8px 10px;border-top:1px solid var(--line);font-weight:600;display:flex;flex-direction:column;justify-content:center;width:170px}
.lane .lh .en{font-size:.62rem;color:var(--muted);font-weight:500}
.lane .lh.fut{color:var(--fut)}
.lane .ph{padding:6px 8px;font-weight:700;font-size:.78rem;text-align:center;background:var(--ink);color:var(--bg);border-inline-start:1px solid var(--bg)}
.lane .ph.fut{background:var(--fut)}
.lane .corner{position:sticky;inset-inline-start:0;z-index:3;background:var(--ink);color:var(--bg);padding:6px 10px;font-weight:700;width:170px}
.lane .cell{border-top:1px solid var(--line);border-inline-start:1px dashed var(--line);padding:6px;min-height:56px;display:flex;align-items:center;justify-content:center}
.node{border:1px solid var(--rose2);background:var(--bg);border-radius:6px;padding:6px 8px;width:118px;text-align:start;line-height:1.35;font-size:.76rem;display:flex;flex-direction:column;gap:3px}
.node:hover,.node[aria-pressed="true"]{border-color:var(--rose);background:var(--hi);box-shadow:0 0 0 2px var(--rose2)}
.node .sq{font-family:var(--f-en);font-size:.66rem;color:var(--rose);font-weight:600}
.node.ai{border-style:dashed}
.node.fut{border-color:var(--fut);border-style:dashed;color:var(--fut);background:var(--futbg)}
.node.loop{border-color:var(--warn)}

/* routing */
.route{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.route .rb{border-radius:var(--r);padding:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.route .rb.undec{border:1px dashed var(--warn);background:var(--warnbg)}
.route .rb .amt{font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:640px){.route{grid-template-columns:1fr}}

/* workspace */
.rolestrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.rolebtn{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 12px;min-width:150px}
.rolebtn .en{font-size:.62rem;color:var(--muted)}
.rolebtn b{font-size:.88rem}
.rolebtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.rolebtn[aria-pressed="true"] .en,.rolebtn[aria-pressed="true"] .xs{color:var(--taupe)}
.rolebtn.fut{border-style:dashed;background:var(--futbg)}
.rolebtn.fut[aria-pressed="true"]{background:var(--fut);border-color:var(--fut)}
.ws{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.ws{grid-template-columns:1fr}}
.rail{position:sticky;top:120px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
@media (max-width:860px){.rail{position:static;flex-direction:row;overflow-x:auto}}
.rail .who{padding:8px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;display:flex;gap:10px;align-items:center}
@media (max-width:860px){.rail .who{display:none}}
.av{width:38px;height:38px;border-radius:50%;background:var(--rose);color:var(--onrose);display:grid;place-items:center;font-weight:700;flex:none}
.rail button{background:none;border:0;text-align:start;padding:8px 10px;border-radius:6px;color:var(--ink2);display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.rail button:hover{background:var(--hi)}
.rail button[aria-current="true"]{background:var(--hi);color:var(--ink);font-weight:700;box-shadow:inset -3px 0 0 var(--rose)}
.cnt{background:var(--rose);color:var(--onrose);border-radius:999px;font-size:.7rem;padding:0 7px;font-variant-numeric:tabular-nums;align-self:center}
.persona{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.persona h3{font-size:1.15rem}
.vtitle{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--taupe)}
.vtitle h2{font-size:1.35rem}
.vtitle .en{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}

/* request detail */
.rhead{display:flex;flex-direction:column;gap:8px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px}
.meta div{display:flex;flex-direction:column;min-width:0}
.meta dt{font-size:.74rem;color:var(--muted)}
.meta dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.nextown{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--hi);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:.88rem}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-top:6px}
.dtabs button{border:0;background:none;padding:8px 12px;white-space:nowrap;color:var(--ink2);border-bottom:2px solid transparent}
.dtabs button[aria-current="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--rose)}
.obs{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.obs .oh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--sunk)}
.obs .ob{padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 18px}
.obs .ob > div{min-width:0}
.obs .lab{font-size:.74rem;color:var(--muted);display:block}
.quote{border-inline-start:3px solid var(--taupe);padding:2px 10px;font-style:italic;color:var(--ink2)}
.alt{background:var(--okbg);color:var(--ink);border-radius:6px;padding:6px 10px}
.resp{border-top:1px dashed var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice span{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.8rem;background:var(--surface)}
.choice span.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.choice span.no{opacity:.4;text-decoration:line-through}
.diff{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.diff del{background:var(--del);text-decoration:line-through;padding:1px 4px;border-radius:3px}
.diff ins{background:var(--ins);text-decoration:none;padding:1px 4px;border-radius:3px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:130px 14px minmax(0,1fr);gap:10px;padding:6px 0}
.tl .ts{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:end}
.tl .tk{position:relative}
.tl .tk::before{content:"";position:absolute;top:8px;inset-inline-start:3px;width:8px;height:8px;border-radius:50%;background:var(--rose)}
.tl .tk::after{content:"";position:absolute;top:18px;bottom:-14px;inset-inline-start:6.5px;width:1px;background:var(--taupe)}
.tl li:last-child .tk::after{display:none}
.tl .ai .tk::before{background:none;border:1.5px solid var(--rose)}
.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.checks li{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:.85rem;animation:pop .35s both}
.checks li .ck{width:18px;height:18px;border-radius:50%;background:var(--ok);color:var(--okbg);display:grid;place-items:center;font-size:.7rem;flex:none}
@keyframes pop{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.checks li{animation:none}}

/* wizard */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.stepper button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.82rem;display:flex;gap:6px;align-items:center}
.stepper button .n{width:20px;height:20px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:.72rem;font-family:var(--f-en)}
.stepper button[aria-current="true"]{border-color:var(--rose);font-weight:700}
.stepper button[aria-current="true"] .n{background:var(--rose);color:var(--onrose)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:.82rem;font-weight:600}
.fld label .rq{color:var(--bad)}
.fld input,.fld select,.fld textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--taupe);border-radius:6px;padding:7px 10px;width:100%}
.fld .hint{font-size:.74rem;color:var(--muted)}
.fld.wide{grid-column:1/-1}
.drop{border:1.5px dashed var(--taupe);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);background:var(--bg)}
.flist{display:flex;flex-direction:column;gap:6px}
.file{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface);font-size:.86rem;flex-wrap:wrap}
.ic{width:30px;height:34px;border-radius:4px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-en);font-size:.6rem;font-weight:700;color:var(--rose);flex:none}
.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cl li{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.cl .ok{color:var(--ok);font-weight:700}

/* matrix */
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:start;min-width:220px}
.lv{display:inline-block;font-size:.72rem;border-radius:4px;padding:1px 6px;font-weight:600;white-space:nowrap}
.lv-edit{background:var(--infobg);color:var(--info)}.lv-appr{background:var(--rose);color:var(--onrose)}.lv-read{background:var(--sunk);color:var(--muted)}
.lv-cond{background:var(--plumbg);color:var(--plum)}.lv-fut{background:var(--futbg);color:var(--fut);border:1px dashed var(--fut)}.lv-none{color:var(--taupe)}

/* subtabs + toggles */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.84rem}
.subtabs button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tog{width:40px;height:22px;border-radius:999px;background:var(--taupe);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:var(--surface)}
.tog.on{background:var(--ok)}
.tog.on::after{inset-inline-start:21px}

/* tour */
.tour{position:fixed;z-index:40;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));margin:0 auto;max-width:820px;background:var(--ink);color:var(--bg);border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px rgba(40,20,10,.35);display:flex;flex-direction:column;gap:8px}
.tour .tbar{height:4px;border-radius:2px;background:rgba(245,239,230,.2);overflow:hidden}
.tour .tbar i{display:block;height:100%;background:var(--rose2)}
.tour .meta2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--taupe)}
.tour h3{color:var(--bg);font-size:1.05rem}
.tour p{font-size:.9rem;color:#EADFD1}
.tour .btn{background:transparent;color:var(--bg);border-color:rgba(245,239,230,.4)}
.tour .btn.pri{background:var(--rose);border-color:var(--rose);color:#fff}
.tour .req{color:var(--rose2);border-color:var(--rose2)}
.tour .actor{background:var(--rose);color:#fff;border-radius:999px;padding:0 10px;font-weight:600}
body.touring main{padding-bottom:220px}
.toast{position:fixed;z-index:50;top:calc(80px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.88rem;box-shadow:0 6px 18px rgba(40,20,10,.3);max-width:calc(100% - 32px)}

/* requirements */
.reqrow td:first-child{font-family:var(--f-en);font-weight:600;color:var(--rose)}
.reqdet td{background:var(--bg)}
.search{font:inherit;border:1px solid var(--taupe);border-radius:6px;padding:7px 12px;background:var(--surface);color:var(--ink);min-width:0;flex:1;max-width:340px}
.dec{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px}
.dec .dn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rose);color:var(--rose);display:grid;place-items:center;font-family:var(--f-en);font-weight:600}
.opt{display:flex;gap:6px;flex-wrap:wrap}
.opt span{border:1px solid var(--taupe);border-radius:6px;padding:2px 10px;font-size:.82rem;background:var(--bg)}
.opt span.as{border-color:var(--rose);background:var(--hi);font-weight:600}
#saveFile{white-space:nowrap}
#saveFile.dirty{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}
@media (max-width:700px){.top .wrap:first-child{flex-wrap:wrap;gap:8px}.top .wrap:first-child .brandtitle{flex-basis:100%}}

</style>

<script>
/* ---------- reference data (illustrative; Legal supplies the real lists) ---------- */
const REQS = [[1,"نطاق المشروع والشركات","التحول الرقمي + القانونية","إنشاء منصة واحدة لمراجعة جميع عقود شركات مجموعة ريف والكيانات التابعة؛ لكل طلب كيان قانوني وقطاع/علامة وإدارة طالبة.","لا يفترض النظام أن العلامة التجارية هي بذاتها شركة متعاقدة؛ يربط العلامة بالكيان القانوني الذي تزوده القانونية."],[2,"قائمة الإدارات الطالبة","التحول الرقمي","إضافة قائمة الإدارات: المراجعة الداخلية والمتابعة؛ التأجير والعقار؛ التحول الرقمي؛ التطوير التنظيمي والتدريب؛ الخدمات المساندة؛ الشؤون القانونية والحوكمة؛ المنتجات؛ رأس المال البشري؛ المالية؛ التجارة الإلكترونية؛ التسويق؛ العمليات؛ سلاسل الإمداد والتوريد؛ تجربة العميل؛ الاستراتيجية؛ الإدارة العليا؛ الشراكات الرقمية؛ B2B.","تكون القائمة قابلة للإضافة والتعديل وتُربط بحسابات الموظفين والقطاعات، مع عدم منح كل إدارة الاطلاع على عقود الإدارات الأخرى."],[3,"الكيانات والقطاعات","القانونية + التحول الرقمي","إنشاء حقول مستقلة للشركة القانونية والقطاع والعلامة التجارية؛ العلامات الظاهرة بالصورة: REEF وOSMA وBUYAR وMEILONA وSELENE للتعريف لا لإثبات الاسم القانوني.","تزوّد القانونية قائمة الشركات وأرقام تسجيلها والمفوضين؛ ويحدد كل كيان/قطاع صاحِب الاعتماد المستقبلي."],[4,"التصنيف الرئيسي للعقد","القانونية + التحول الرقمي","إعداد قائمة: تسويق وإعلان، مقاولات وإنشاءات، عقارات وإيجارات، توريد ومشتريات، خدمات مهنية، تقنية وتحول رقمي، خدمات لوجستية، ملكية فكرية، اتفاقيات تجارية، تمويل وشركات، موارد بشرية (مسار متخصص)، أخرى.","الاختيار من الإدارة الطالبة، ويعيد الذكاء الاصطناعي التحقق من صحة التكييف بحسب مضمون الالتزامات؛ خيار «أخرى» يراجع قانونيًا."],[5,"التصنيف الفرعي والمختلط","القانونية + التحول الرقمي","ربط نوع العقد بتصنيف فرعي: مثل مؤثرين/إنتاج محتوى؛ تشطيبات/إنشاء فروع؛ إيجار/استثمار/تأجير من الباطن؛ مواد خام/عبوات/معدات.","إذا كان العقد مختلطًا (مثل توريد وتركيب) يطبق النظام أكثر من مكتبة فحص عند اللزوم مع تنبيه للمختص."],[6,"الدول والاختصاصات","القانونية + التحول الرقمي","إضافة السعودية، الإمارات، قطر، الكويت، البحرين، سلطنة عمان، تركيا، الولايات المتحدة الأمريكية، المملكة المتحدة (لندن)، فرنسا؛ مع خيار إضافة دولة أخرى.","تسجيل القانون الواجب التطبيق والولاية/الإقليم عند الحاجة؛ «لندن» مدينة وليست نظامًا قانونيًا مستقلًا، والولايات المتحدة تحتاج تحديد الولاية عند الاقتضاء."],[7,"مكتبة الأنظمة القانونية","الإدارة القانونية","إنشاء شاشة رفع الأنظمة واللوائح والقرارات والمراجع لكل دولة/اختصاص وتعيين نسخة المرجع وتاريخ تحديثه ونوع العقود التي يسري عليها.","القانونية تضيف المحتوى بعد بناء النظام؛ عند عدم توفر مرجع أو الشك في سريانه يذكر الذكاء الاصطناعي ذلك صراحة ويُحيل للمراجعة البشرية."],[8,"مكتبة البنود العامة","الإدارة القانونية","شاشة لإضافة البنود المشتركة: أسماء الأطراف وصفاتهم وصلاحية التوقيع؛ موضوع العقد؛ المدة والتجديد؛ المقابل والدفعات؛ الإنهاء/الفسخ؛ المسؤولية؛ التعويض؛ الغرامات؛ السرية؛ الملكية الفكرية؛ القانون والاختصاص؛ الإشعارات وغيرها.","لكل بند درجة تطبيق (إلزامي/مشروط/تفاوضي/غير منطبق)، ومعيار قبول، وخطر، وصياغة بديلة؛ ليس كل بند مطلوبًا بالنص نفسه في كل عقد."],[9,"مكتبة البنود الخاصة","الإدارة القانونية","شاشة مستقلة داخل المنصة لربط قواعد متخصصة بكل نوع: التسويق (المخرجات والتسليم والموافقات وحقوق المحتوى)؛ المقاولات (ضمان الأعمال والعيوب والاستلام والتغييرات)؛ الإيجار (الأجرة والتجديد والصيانة والتأجير من الباطن)؛ وهكذا لبقية الأنواع.","القانونية تحدد في مرحلة تالية البنود الخاصة لكل عقد ومتى تعد إلزامية أو مشروطة بحسب الدولة."],[10,"معايير مخاطر المراجعة","الإدارة القانونية","إضافة مستويات ملاحظة: مرتفع، متوسط، منخفض، يحتاج مراجعة؛ وأنواع: بند ناقص، التزام غير متوازن، غرامة، صياغة غامضة، تعارض، مخالفة محتملة، نقص مستند.","وضع قواعد تمنع تجاوز المخالفة النظامية أو التفويض غير الصحيح عن طريق إقرار تحمل المسؤولية وحده."],[11,"المستخدمون والصلاحيات","التحول الرقمي + القانونية","تعريف الأدوار: مقدم الطلب، مسؤول الإدارة الطالبة، رئيس القسم القانوني، الأخصائي القانوني، مدير الشؤون القانونية، المالية (مستقبلًا)، الرئيس التنفيذي للقطاع/المجموعة (مستقبلًا).","صلاحيات قراءة وتعديل واعتماد مفصولة، مع تحديد من يملك طلب استثناء ومن يوافق عليه."],[12,"حالات الطلب داخل النظام","التحول الرقمي","تفعيل حالات موحدة: مسودة؛ مقدم؛ قيد الفحص الآلي؛ يوجد ملاحظات/أعيد للإدارة؛ أعيد رفع نسخة معدلة؛ طلب استثناء؛ قيد التوزيع؛ قيد المراجعة القانونية؛ معتمد قانونيًا؛ أعيد للتعديل؛ مغلق؛ وباقي حالات الموافقات المستقبلية.","ظهور حالة الطلب وتاريخها ومسؤول الخطوة التالية لدى جميع الأطراف المصرح لهم."],[13,"فتح طلب جديد","الإدارة الطالبة","يدخل الموظف من Dynamics أو الواجهة المرتبطة، ويُنشئ طلب مراجعة عقد برقم تسلسلي تلقائي.","لا يُرسل العقد إلى الأخصائي مباشرة خارج مسار النظام إلا وفق إجراء استثنائي موثق."],[14,"البيانات الرئيسية","الإدارة الطالبة","حقول إلزامية: الشركة المتعاقدة، الإدارة، مقدم الطلب، الطرف المقابل، عنوان العقد، الغرض، التصنيف الرئيسي/الفرعي، الدولة، قيمة العقد والعملة، مدة العقد إن وجدت.","تحديد القانون الواجب التطبيق إذا اختلف عن بلد التنفيذ، وإضافة القطاع والولاية أو المدينة عند الحاجة."],[15,"القيمة والعملة","الإدارة الطالبة + التحول الرقمي","إدخال إجمالي قيمة العقد، العملة، شمول الضريبة، طريقة احتساب المبالغ أو الالتزامات المتغيرة، وتوفير قيمة مكافئة بالريال للعقود الأجنبية.","تحدد المالية/القانونية لاحقًا أساس المقارنة بسقوف الموافقات وتاريخ سعر الصرف والعقود بلا مقابل."],[16,"رفع المرفقات","الإدارة الطالبة","رفع مسودة العقد بصيغة Word/PDF مع الملاحق ونطاق العمل والعرضين الفني والمالي والمخططات أو مستندات التعاقد عند وجودها.","يحتفظ النظام بالأصل دون تغيير، ويسمح بعدة ملفات ويرتبط كل ملف برقم الطلب."],[17,"التحقق من اكتمال الطلب","النظام","فحص وجود الحقول والملفات الإلزامية وسلامة صيغة المرفقات وإمكانية قراءة نص العقد.","إذا نقصت بيانات مؤثرة يمنع الانتقال أو يعيد الطلب لاستكمالها، مع بيان المطلوب."],[18,"قراءة المستندات","محرك الذكاء الاصطناعي","استخراج النصوص والبنود من العقد وملاحقه، وربطها بطلب الإدارة، وتحديد الوثائق المتعارضة أو غير المقروءة.","لا يعتمد على اسم الملف أو عنوان العقد فقط، ولا يختلق معلومات من مرفقات مفقودة."],[19,"التكييف القانوني","محرك الذكاء الاصطناعي","مقارنة نوع العقد الذي اختارته الإدارة مع طبيعة الأعمال والالتزامات الفعلية؛ تطبيق فحص مختلط عند تعدد أنواع الأعمال.","إذا اختلف التكييف أو تعذر تصنيفه تسجل ملاحظة لمراجعة المختص."],[20,"مراجعة نظام الدولة","محرك الذكاء الاصطناعي","مراجعة العقد طبقًا للمراجع القانونية المعتمدة الخاصة بالدولة/القانون المختار، وإيراد مرجع المخالفة أو التعارض عند توفره.","لا تُنسب مواد نظامية دون مرجع معتمد؛ غياب مرجع أو تعارض قوانين يُصعّد للمراجعة القانونية."],[21,"فحص البنود العامة","محرك الذكاء الاصطناعي","فحص الأطراف وصفاتهم والتفويض، مدة العقد وتجديده، الدفعات، الإنهاء، المسؤولية، الاختصاص، السرية، الملكية الفكرية، الإشعارات، والجزاءات ونحوها.","الفحص حسب معيار القبول المحدد في المكتبة، وليس مجرد وجود عنوان البند."],[22,"فحص البنود المتخصصة","محرك الذكاء الاصطناعي","التأكد من شروط نوع العقد: مثال المقاولات ضمان الأعمال وإصلاح العيوب وأوامر التغيير ومحاضر الاستلام؛ التسويق المخرجات والتواريخ والموافقة قبل النشر وحقوق المحتوى؛ العقارات الصيانة والتجديد والإخلاء.","يتغير نطاق الفحص آليًا باختلاف تصنيف العقد والدولة؛ ويذكر عند عدم انطباق بند."],[23,"استخراج التزامات الشركة","محرك الذكاء الاصطناعي","حصر الالتزامات الواقعة على الشركة: مبالغ ودفعات، غرامات وتعويضات، ضمانات، مواعيد، صيانة، تسليم، إشعارات، اشتراطات تمنع الإنهاء، أو التزامات مستقبلية.","تمييز التزامات الشركة عن التزامات الطرف الآخر، وبيان أي التزامات غير متوازنة أو غير محددة."],[24,"الغرامات والجزاءات","محرك الذكاء الاصطناعي","رصد أي غرامة أو شرط جزائي أو تعويض اتفاقي يقع على الشركة مع بيان سببه وقيمته وشروط تطبيقه.","لا يعتبر البند مقبولًا تلقائيًا؛ يطلب تعديله أو حذفه أو عرضه على القانونية بحسب السياسة التي تعتمدها لاحقًا."],[25,"مقارنة العقد بالمرفقات","محرك الذكاء الاصطناعي","مقارنة نطاق العمل والدفعات والمدة والمخرجات بالعروض الفنية والمالية والملاحق مع إبراز التعارضات أو النواقص.","إذا لم تُرفع ملاحق أساسية يجب طلبها وعدم افتراض مضمونها."],[26,"تقرير ملاحظات مفصل","محرك الذكاء الاصطناعي","إخراج لكل ملاحظة: رقمها؛ نوعها (عام/خاص/التزام على الشركة/نظامي)؛ نص أو موضع البند؛ سبب الخطر؛ درجته؛ المعيار/المرجع؛ توصية الحذف أو التعديل أو الإضافة؛ وصياغة بديلة.","يسمح بإخراج التقرير للمستخدم داخل الطلب وكتقرير مرفق، ويكون قابلًا للتحقق وتتبع كل ملاحظة."],[27,"تحديد نتيجة الفحص","النظام + الذكاء الاصطناعي","النتيجة إما: لا توجد ملاحظات في الفحص الآلي؛ توجد ملاحظات تستلزم تعديلًا؛ مستندات ناقصة؛ أو ملاحظات تستلزم قرار المختص.","عدم وجود ملاحظات لا يساوي موافقة قانونية نهائية؛ جميع العقود تذهب للمراجع القانوني قبل الإغلاق."],[28,"إعادة العقد للإدارة الطالبة","النظام","إذا ظهرت ملاحظات قابلة للتعديل، يعيد الطلب للإدارة الطالبة تلقائيًا مع التقرير الكامل ويرسل تنبيهًا.","لا يُعد الطلب معتمدًا في هذه الحالة، ولا يفقد النظام النسخة السابقة أو الملاحظات عليها."],[29,"الاطلاع والرد على الملاحظات","الإدارة الطالبة","عرض كل ملاحظة مع خيار: تمت المعالجة، أطلب توضيحًا، أو أطلب استثناء/تحمل مسؤولية؛ وإضافة رد ومرفق داعم لكل بند.","لا يسمح بإغلاق الملاحظة بمجرد اختيار «تمت» دون رفع نسخة محدّثة أو توثيق المعالجة."],[30,"تعديل العقد وإعادة رفعه","الإدارة الطالبة","تتواصل الإدارة مع الطرف المقابل لتعديل البنود، ثم ترفع نسخة جديدة من العقد مع بيان البنود التي جرى تعديلها أو مع نسخة تتبع التغييرات إن وجدت.","يحتفظ النظام بالنسخة الأصلية والنسخ الجديدة، مع رقم نسخة وتاريخ واسم الرافع."],[31,"إعادة الفحص بالذكاء الاصطناعي","محرك الذكاء الاصطناعي","يعيد قراءة النسخة الجديدة ومقارنتها بالنسخة السابقة ومراجعة كامل العقد وقائمة الملاحظات القديمة وأي تغييرات جديدة.","يبين هل عولجت كل ملاحظة أم بقيت، ويرصد إن أدخل التعديل مخاطر جديدة؛ يمكنه اقتراح صياغة مصححة أو ملف تعديلات، دون تغيير النسخة الأصلية خفية."],[32,"التكرار حتى إغلاق الملاحظات","النظام","إذا بقيت ملاحظات قابلة للتعديل تُعاد للإدارة الطالبة ويكرر مسار التعديل والفحص للنسخة التالية.","تحتفظ المنظومة بكل جولات المراجعة ولا تعتبر الملاحظات مغلقة إلا بعد التحقق منها أو اعتماد الاستثناء وفق الضوابط."],[33,"التعامل مع الملاحظات المعالجة","النظام + الذكاء الاصطناعي","عند معالجة الملاحظات، توسم آليًا بأنها «عولجت مبدئيًا» وتُنتج نسخة محدثة من التقرير تعرض فقط المفتوح منها مع سجل المغلق.","اعتماد «مغلقة» نهائيًا يكون بمراجعة المختص القانوني."],[34,"طلب عدم تعديل بند","الإدارة الطالبة","إذا رفض الطرف المقابل تعديل بند أو رغبت الإدارة الطالبة في استمرار العقد على حاله، تختار «طلب استثناء» أمام الملاحظة المحددة، مع ذكر السبب التجاري/التشغيلي والمبررات.","يجب أن يكون طلب الاستثناء مرتبطًا برقم ملاحظة وبند بعينه؛ لا يقبل إقرار عام يلغي كل الملاحظات."],[35,"نموذج تحمل المسؤولية","الإدارة الطالبة + القانونية","إظهار نموذج حقول: رقم العقد، الإدارة الطالبة، اسم صاحب الصلاحية وصفته، أرقام الملاحظات غير المعالجة، شرح المخاطر، سبب عدم التعديل، القرار المطلوب، التاريخ، التوقيع/الإقرار الإلكتروني.","إقرار المسؤولية ليس بديلاً عن الفحص القانوني، ولا ينقل أو يسقط مسؤولية الشركة تجاه الغير بقوة النظام."],[36,"صيغة الإقرار المقترحة","الإدارة القانونية","«أقر أنا/نحن (...) بصفتي (...) وبالنيابة عن الإدارة الطالبة (...) بأنني اطلعت على الملاحظات القانونية المحددة بالأرقام (...) الواردة في تقرير مراجعة العقد رقم (...)، وأدركت المخاطر المبيّنة فيها، وأطلب الاستمرار في التعاقد دون الأخذ بالتعديلات المشار إليها للأسباب التالية (...). وأتحمل ضمن حدود صلاحياتي واختصاصاتي المسؤولية الداخلية المترتبة على هذا الطلب والقرار، دون أن يعد ذلك إجازة لمخالفة الأنظمة أو إعفاءً من الاعتمادات النظامية والصلاحيات المعتمدة. ويظل القرار خاضعًا لمراجعة الإدارة القانونية وموافقة صاحب الصلاحية المختص».","صيغة أولية تخضع لاعتماد القانونية والتوقيع من مسؤول مخوّل، ولا يكفي مجرد اختيار مربع من مستخدم غير مفوض."],[37,"ضوابط منع الاستثناء","الإدارة القانونية + النظام","تصنيف الملاحظات إلى: قابلة للتفاوض/القبول المشروط، أو غير قابلة للتجاوز (مثل مخالفة آمرة، غياب سلطة التوقيع، التزام مخالف لمتطلب نظامي).","لا يمنح النظام خيار إتمام استثناء تلقائي للمخالفات غير القابلة للتجاوز، ويلزم إحالتها للمختص القانوني."],[38,"الموافقة على الاستثناء أو رفضه","المختص القانوني المخوّل","بعد الإقرار يراجع المختص المخاطر والمبررات ويعتمد القبول بشروط أو يرفضه أو يعيده للتعديل، مع توثيق موافقة صاحب الصلاحية عند اشتراطها.","الموافقة لا تصدر من الذكاء الاصطناعي ولا من الإدارة الطالبة منفردة؛ موافقة المختص القانونية إلزامية."],[39,"تحديث حالة الملاحظات","النظام","تقسيم البنود إلى: عولجت؛ قبلت باستثناء معتمد؛ لم تعالج/مرفوض الاستثناء؛ تحتاج تحققًا إضافيًا.","لا ينتقل الطلب إلى الموافقة القانونية إلا إذا عولجت الملاحظات أو جرى البت في الاستثناءات ضمن حدود الصلاحيات."],[40,"تحويل الطلب للمختص القانوني","النظام","بعد الفحص الآلي ومعالجة الملاحظات أو رفع الاستثناءات، يوجه الطلب إلى الإدارة القانونية مع المسودة النهائية وجميع التقارير والمرفقات.","التحويل مبني على إجمالي القيمة المعتمدة للحساب وفق سياسة المبالغ التي تُحسم قبل التشغيل."],[41,"أقل من 500 ألف ريال","النظام → رئيس القسم القانوني","إذا كانت قيمة العقد أقل من 500,000 ريال أو ما يعادلها وفق القاعدة المعتمدة، يصل الطلب إلى رئيس القسم القانوني لتوزيعه على أحد الأخصائيين.","إحالة داخل الإدارة القانونية فقط؛ لا تفعيل لموافقات المالية أو التوقيع التنفيذي حاليًا."],[42,"أكثر من 500 ألف ريال","النظام → مدير الشؤون القانونية","إذا كانت قيمة العقد أكثر من 500,000 ريال أو ما يعادلها وفق القاعدة المعتمدة، يحال مباشرة إلى مدير الشؤون القانونية.","يمكن للمدير توزيع العمل وفق صلاحياته لكن يحتفظ النظام بجهة الإحالة المعتمدة."],[43,"يساوي 500 ألف ريال","الإدارة القانونية + التحول الرقمي","إضافة قاعدة قابلة للضبط لطلب قيمته تساوي 500,000 ريال تمامًا؛ لم يُحدد مساره في الاجتماع.","يُمنع الفراغ في التوجيه قبل الإطلاق؛ يُعتمد القرار من الإدارة القانونية ولا يُفترض أحد الطرفين تلقائيًا."],[44,"مراجعة الموظف القانونية النهائية","الأخصائي / المدير بحسب المسار","يفتح المختص العقد النهائي، وتقرير الذكاء الاصطناعي، وفروقات الإصدارات، والتزامات الشركة، وسجل تعديل الملاحظات، وطلبات الاستثناء؛ ثم يفحصها قانونيًا.","له تعديل التقرير وطلب مستندات ورفض إغلاق ملاحظة أو طلب إعادة العقد للإدارة الطالبة."],[45,"اعتماد أو إعادة أو رفض","المختص القانوني المخوّل","توفير أزرار: موافقة قانونية؛ إعادة للإدارة لاستكمال التعديل؛ تعليق لحين مستند؛ أو رفض مع تسبيب، وفق صلاحيات الدور.","عند إعادة العقد تُفعّل جولة التعديل والفحص الآلي مجددًا؛ ولا يتحول الطلب إلى معتمد دون قرار بشري."],[46,"نهاية النطاق الحالي","النظام","عند موافقة المختص القانوني تحفظ النسخة المعتمدة وتقرير المراجعة والقرارات والسجل المرتبط بها، وتُشعر الإدارة الطالبة بانتهاء المراجعة القانونية.","الاعتماد هنا قانوني فقط؛ ولا يعد توقيعًا أو اعتمادًا ماليًا أو تنفيذًا للعقد."],[47,"الاعتماد المالي","الإدارة المالية","بعد اكتمال الموافقة القانونية يرسل العقد إلى المالية لمراجعة الالتزامات المالية والاعتماد أو الإرجاع حسب الصلاحيات.","هذه الخطوة غير مفعّلة في المرحلة الحالية ويجب التحكم بها بإعداد تفعيل مرحلي."],[48,"التوجيه بحسب مليون ريال","النظام","بعد الموافقة المالية: إذا كانت قيمة العقد أكبر من 1,000,000 ريال يحال للرئيس التنفيذي للمجموعة؛ وإذا كانت أقل من 1,000,000 ريال يحال للرئيس التنفيذي للقطاع.","تطبيق الحدود حسب القيمة والأساس وسعر الصرف المعتمد. لا يُعدل النظام حدّ الموافقات دون تصريح."],[49,"يساوي مليون ريال","الإدارة العليا + القانونية","وضع قاعدة منفصلة للعقد الذي تساوي قيمته 1,000,000 ريال تمامًا؛ لم يحسم مسار هذه الحالة في الاجتماع.","تُعتمد جهة التوقيع قبل تفعيل المرحلة المستقبلية."],[50,"التوقيع والأرشفة","صاحب الصلاحية + النظام","يصل العقد إلى صاحب سلطة التوقيع المختص ثم يحفظ العقد الموقع مع التواريخ والنسخ والموافقات في المستودع.","التوقيع الإلكتروني عند اعتماد الأداة ومستندات التفويض والضوابط ذات العلاقة."],[51,"التحقق من مبلغ العقد","المالية + القانونية + التحول الرقمي","حسم ما إذا كانت العتبات وفق القيمة الإجمالية أو السنوية، شاملة/غير شاملة الضريبة، وكيفية التعامل مع العملات الأجنبية والعقود بلا مقابل والمتغيرة القيمة والتجديدات.","تكتب القاعدة في شاشة إعدادات قابلة للتعديل بعد اعتمادها ولا يعتمد رقم مجرد غير موثق."],[52,"حفظ الإصدارات وسجل القرارات","التحول الرقمي","حفظ كل نسخة عقد وكل تقرير مراجعة وحالة كل ملاحظة ورد الإدارة وقرارات المختص والإقرار، مع اسم المستخدم والتاريخ والتوقيت.","لا يُسمح باستبدال النسخة المعتمدة دون إنشاء إصدار جديد؛ توفير سجل تدقيق قابل للاستخراج."],[53,"التنبيهات والتحكم في الوصول","التحول الرقمي","إشعارات لكل مرحلة: طلب مستند، ملاحظات، إعادة رفع، استثناء، إحالة، اعتماد؛ مع تقييد الاطلاع والإجراءات بالمخولين.","عرض الالتزامات والمرفقات الحساسة وفق الحاجة إلى المعرفة، وتحديد صلاحيات الاستثناء والاعتماد."],[54,"سرية البيانات والذكاء الاصطناعي","التحول الرقمي + القانونية","اختيار خدمة ذكاء اصطناعي مؤسسية معتمدة وحفظ العقود بأذونات محددة، وتنظيم الاحتفاظ بالملفات ومعالجة البيانات الحساسة عبر الدول.","عدم رفع العقود إلى أدوات عامة غير معتمدة؛ مراجعة ضوابط حماية البيانات وإقامتها ونقلها عبر الحدود عند الاقتضاء."],[55,"الربط مع Dynamics","إدارة التحول الرقمي","تحديد التنفيذ التقني عبر Dynamics أو الأنظمة المرتبطة به، مع نموذج تقديم، محرك توجيه، شاشة النتائج، لوحة حالات الطلب، ومستودع الوثائق.","تترك طريقة البناء والتكامل التقنية لإدارة التحول الرقمي بعد دراسة الأنظمة الحالية."],[56,"اختبار النظام قبل التعميم","التحول الرقمي + القانونية","تشغيل تجريبي على عقود تسويق ومقاولات وإيجارات ومن دول مختلفة؛ اختبار وجود ملاحظات وتعديل متكرر وإقرار استثناء وحالات توجيه بمبالغ مختلفة.","تقارن القانونية النتائج بالمراجعة البشرية، ولا يشغّل المسار النهائي إلا بعد التحقق من دقة التصنيف والتوجيه والملاحظات."],[57,"مسؤوليات إدارة التحول الرقمي","إدارة التحول الرقمي","تطوير الواجهة وقوائم البيانات والتوجيه وتكرار رفع النسخ ومراجعة الذكاء وتقارير الملاحظات وطلبات الاستثناء وصلاحيات الاعتماد والسجل.","تنشأ المكتبات القانونية كحقول قابلة للتحرير دون إعادة تطوير كلما تغيّر بند أو مرجع."],[58,"مسؤوليات الإدارة القانونية","الإدارة القانونية والحوكمة","بعد تجهيز الهيكل: إضافة الأنظمة للدول، واعتماد التصنيفات والتكييف، والبنود العامة والخاصة، وضوابط الغرامات، وسياسات الاستثناء، ومصفوفة المخاطر والصياغات البديلة.","تعتمد القانونية المحتوى وتشرف على تحديثه؛ والموظف القانوني يراجع كل عقد قبل الموافقة النهائية."]];

/* ---------- reviewer notes: kept in this browser (localStorage) AND inside the HTML file itself ----------
   The file carries its notes in the JSON script block with id reef-notes. On open they are merged into
   this browser's notes; "save the file with notes" writes a copy of this page with every note embedded. No server. */
const NK='reef-contract-proto-notes-v1',DK=NK+'-deleted',RK='reef-contract-proto-reviewer';
const NTYPE={note:['ملاحظة','neutral'],question:['سؤال','plum'],change:['تعديل مطلوب','warn'],gap:['متطلب ناقص','bad']};
const DTAB_AR={summary:'الملخص',report:'تقرير الذكاء الاصطناعي',obs:'الملاحظات',versions:'الإصدارات',oblig:'التزامات الشركة',exception:'الاستثناء والإقرار',log:'السجل'};
const LIB_AR={policies:'السياسات',laws:'مكتبة الأنظمة',general:'البنود العامة',special:'البنود الخاصة',risk:'معايير المخاطر',ack:'صيغة الإقرار'};
const IN_FRAME=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const IS_FILE=(()=>{try{return location.protocol==='file:'}catch(e){return false}})();
const EMBED_RE=/(<script type="application\/json" id="reef-notes">)[\s\S]*?(<\/script>)/;
/* the page exactly as it was opened, taken before anything is drawn, so a saved copy is a clean page plus notes */
const SRC=(()=>{try{const h=document.documentElement.outerHTML;return EMBED_RE.test(h)?'<!doctype html>\n'+h:null}catch(e){return null}})();
let STORE_OK=true;
function validNote(n){return!!(n&&typeof n.id==='string'&&typeof n.title==='string'&&n.title.trim()&&typeof n.desc==='string')}
function cleanNote(n){return{id:n.id,title:String(n.title).slice(0,140),desc:String(n.desc).slice(0,3000),name:String(n.name||'').slice(0,80),type:NTYPE[n.type]?n.type:'note',status:n.status==='done'?'done':'open',
  ctx:n.ctx&&typeof n.ctx.label==='string'?n.ctx:null,created:String(n.created||new Date().toISOString()),updated:String(n.updated||n.created||'')}}
function readJSON(k,def){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?def:v}catch(e){STORE_OK=false;return def}}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));STORE_OK=true}catch(e){STORE_OK=false}}
function readEmbedded(){try{const el=document.getElementById('reef-notes');const d=JSON.parse(el?el.textContent:'{}')||{};
  return{notes:Array.isArray(d.notes)?d.notes.filter(validNote).map(cleanNote):[],deleted:Array.isArray(d.deleted)?d.deleted.filter(x=>typeof x==='string'):[]}}catch(e){return{notes:[],deleted:[]}}}
/* merge by id; the more recently updated copy wins; anything deleted stays deleted */
function mergeNotes(a,b,deleted){const m=new Map();[...a,...b].forEach(n=>{const o=m.get(n.id);if(!o||String(n.updated)>String(o.updated))m.set(n.id,n)});
  const del=new Set(deleted);return[...m.values()].filter(n=>!del.has(n.id)).sort((x,y)=>String(y.created).localeCompare(String(x.created)))}
const sigOf=list=>JSON.stringify(list.map(n=>[n.id,n.updated,n.status]).sort());
const EMB=readEmbedded();
let DELETED=[...new Set([...(readJSON(DK,[])||[]).filter(x=>typeof x==='string'),...EMB.deleted])];
let NOTES=mergeNotes((readJSON(NK,[])||[]).filter(validNote).map(cleanNote),EMB.notes,DELETED);
const FROM_FILE=EMB.notes.length;
let FILE_SIG=sigOf(mergeNotes([],EMB.notes,DELETED));
function saveNotes(){writeJSON(NK,NOTES);writeJSON(DK,DELETED)}
saveNotes();
const isDirty=()=>sigOf(NOTES)!==FILE_SIG;
function getName(){try{return localStorage.getItem(RK)||''}catch(e){return ''}}
function setName(v){try{localStorage.setItem(RK,v)}catch(e){}}
const NS={nm:null,del:null,q:'',type:'all',st:'all',imp:false,copyText:null,msg:FROM_FILE?['',`يحتوي هذا الملف على ${FROM_FILE} ملاحظة، وأُضيفت إلى ملاحظاتك في هذا المتصفح.`]:null};
const newId=()=>'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtDate=iso=>{try{return new Date(iso).toLocaleString('ar-SA-u-ca-gregory-nu-latn',{dateStyle:'medium',timeStyle:'short'})}catch(e){return iso}};

function ctxNow(){const t=TABS.find(x=>x[0]===S.tab);let label=t?t[1]:'';
  if(S.tab==='workspace'){const r=RB[S.role];label+=' › '+r.ar+' › ';
    if(S.view==='detail')label+='الطلب '+(S.detailId||'')+' › '+(DTAB_AR[S.dtab]||'');
    else{label+=(r.views.find(x=>x[0]===S.view)||['',''])[1];if(S.view==='new')label+=' › الخطوة '+(S.wz+1);if(S.view==='libraries')label+=' › '+(LIB_AR[S.lib]||'');if(S.view==='review')label+=' › '+(DTAB_AR[S.dtab]||'')}}
  if(S.tab==='journey'&&S.jsel!=null)label+=' › '+JNODES[S.jsel].t;
  return{tab:S.tab,role:S.role,view:S.view,detailId:S.detailId,dtab:S.dtab,wz:S.wz,lib:S.lib,k:S.k,jsel:S.jsel,label}}

/* header: the save button shows wherever the page is a real file or a hosted page, never inside claude.ai */
function notesHeader(){const b=$('#saveFile');if(!b)return;if(IN_FRAME||!SRC){b.hidden=true;return}
  b.hidden=false;const d=isDirty();b.className='btn'+(d?' dirty':'');b.textContent=d?'حفظ الملف مع الملاحظات ●':'حفظ الملف مع الملاحظات';b.title=d?'توجد ملاحظات لم تُحفظ في الملف بعد':'الملف محفوظ مع كل الملاحظات'}

/* modal */
function openNote(id){const n=id?NOTES.find(x=>x.id===id):null;NS.nm={id:n?n.id:null,ctx:n?n.ctx:(S.tab==='notes'?null:ctxNow()),n};renderModal();setTimeout(()=>{const f=$('#n-title');f&&f.focus()},30)}
function closeNote(){NS.nm=null;renderModal();const b=$('#addNote');b&&b.focus()}

  const m=NS.nm,n=m.n||{},name=n.name||getName();el.hidden=false;
  el.innerHTML=`<div class="modal-back" data-a="nclose"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="nm-h">
   <div class="row"><h2 id="nm-h" style="flex:1;font-size:1.25rem">${m.id?'تعديل الملاحظة':'ملاحظة جديدة'}</h2><button class="btn ghost" data-a="nclose" aria-label="إغلاق">إغلاق</button></div>
   <div class="form"><div class="fld"><label for="n-name">اسمك</label><input id="n-name" maxlength="80" value="${esc(name)}" autocomplete="name"><span class="hint">يُحفظ لملاحظاتك التالية</span></div>

    <div class="fld wide"><label for="n-title">العنوان <span class="rq">*</span></label><input id="n-title" maxlength="140" value="${esc(n.title||'')}" placeholder="مثال: من يوقّع إقرار تحمل المسؤولية؟"></div>
    <div class="fld wide"><label for="n-desc">الوصف <span class="rq">*</span></label><textarea id="n-desc" rows="5" maxlength="3000" placeholder="اكتب الملاحظة بالتفصيل">${esc(n.desc||'')}</textarea></div></div>
   ${m.ctx?`<label class="row small" for="n-link"><input type="checkbox" id="n-link" ${m.id&&!n.ctx?'':'checked'}><span>اربطها بالشاشة: <b>${esc(m.ctx.label)}</b></span></label>`:''}
   <div id="n-err" class="note bad" hidden></div>
   <p class="xs muted">${IN_FRAME?'تُحفظ الملاحظة في هذا المتصفح فقط. لإرسالها انسخها من «ملاحظات المراجعين».':'تُحفظ الملاحظة في هذا المتصفح فورًا. لتصل إلى الفريق اضغط «حفظ الملف مع الملاحظات» ثم أرسل الملف.'}</p>
   <div class="row"><button class="btn pri" data-a="nsave">${m.id?'حفظ التعديل':'حفظ الملاحظة'}</button><button class="btn" data-a="nclose">إلغاء</button></div></div>`}
function saveFromModal(){const t=$('#n-title').value.trim(),d=$('#n-desc').value.trim(),nm=$('#n-name').value.trim(),ty=$('#n-type').value,err=$('#n-err');
  if(!t||!d){err.hidden=false;err.textContent=!t?'اكتب عنوان الملاحظة.':'اكتب وصف الملاحظة.';(!t?$('#n-title'):$('#n-desc')).focus();return}
  setName(nm);const link=$('#n-link');const ctx=NS.nm.ctx&&(!link||link.checked)?NS.nm.ctx:null;const now=new Date().toISOString();
  if(NS.nm.id){const n=NOTES.find(x=>x.id===NS.nm.id);Object.assign(n,{title:t,desc:d,name:nm,type:ty,ctx,updated:now})}
  else NOTES.unshift({id:newId(),title:t,desc:d,name:nm,type:ty,ctx,status:'open',created:now,updated:now});
  saveNotes();NS.nm=null;renderModal();render();toast(!STORE_OK?'تعذر الحفظ في هذا المتصفح؛ احفظ الملف مع الملاحظات الآن':IN_FRAME?'حُفظت الملاحظة في هذا المتصفح':'حُفظت الملاحظة. احفظ الملف مع الملاحظات قبل إرساله')}

/* list */
function notesFiltered(){const q=NS.q.trim();return NOTES.filter(n=>(NS.type==='all'||n.type===NS.type)&&(NS.st==='all'||n.status===NS.st)&&(!q||(n.title+' '+n.desc+' '+(n.name||'')+' '+(n.ctx?n.ctx.label:'')).includes(q)))}
function noteCard(n){const ty=NTYPE[n.type]||NTYPE.note,done=n.status==='done';
  return `<article class="card stack ncard ${done?'done':''}"><div class="row">${P(ty[1],ty[0])}${done?P('ok','تمت المعالجة'):P('info','مفتوحة')}<span class="sp"></span><span class="xs muted num">${esc(fmtDate(n.created))}</span></div>
   <h3>${esc(n.title)}</h3><p class="small ndesc">${esc(n.desc)}</p>
   ${n.ctx?`<button class="btn ghost nlink" data-a="ngo" data-v="${esc(n.id)}" title="اذهب إلى الشاشة">◆ ${esc(n.ctx.label)}</button>`:'<span class="xs muted">ملاحظة عامة غير مرتبطة بشاشة</span>'}
   <div class="row xs muted"><span>${n.name?esc(n.name):'بدون اسم'}</span>${n.updated&&n.updated!==n.created?'<span>· عُدّلت</span>':''}</div>
   ${NS.del===n.id?`<div class="note bad row small"><span style="flex:1">حذف هذه الملاحظة؟ تُحذف أيضًا من الملف عند حفظه.</span><button class="btn danger" data-a="ndelok" data-v="${esc(n.id)}">نعم، احذف</button><button class="btn" data-a="ndelno">إلغاء</button></div>`:
   `<div class="row"><button class="btn" data-a="ntoggle" data-v="${esc(n.id)}">${done?'إعادة فتح':'تمت المعالجة'}</button><button class="btn" data-a="nedit" data-v="${esc(n.id)}">تعديل</button><button class="btn ghost" data-a="ndel" data-v="${esc(n.id)}" style="color:var(--bad)">حذف</button></div>`}</article>`}
function notesListHtml(){const l=notesFiltered();
  if(!NOTES.length)return `<div class="empty">لا توجد ملاحظات بعد. اضغط «أضف ملاحظة» أعلى الصفحة من أي شاشة، وستُربط الملاحظة بتلك الشاشة.</div>`;
  if(!l.length)return '<div class="empty">لا توجد ملاحظات مطابقة للبحث أو التصفية</div>';
  return `<div class="grid g3">${l.map(noteCard).join('')}</div>`}
function shareCard(){if(IN_FRAME||!SRC)return '';const d=isDirty();
  return `<div class="card stack" style="border-color:var(--rose)"><div class="row"><h3 style="flex:1;min-width:0">مشاركة ملاحظاتك</h3>${d?P('warn','ملاحظات لم تُحفظ في الملف'):P('ok','الملف محفوظ مع كل الملاحظات')}</div>
   <ol class="small" style="margin:0;padding-inline-start:20px"><li>أضف ملاحظاتك من أي شاشة بزر «أضف ملاحظة».</li><li>اضغط «حفظ الملف مع الملاحظات». ${IS_FILE?'اختر الملف نفسه لاستبداله، أو احفظ نسخة باسم جديد.':''}</li><li>أرسل الملف المحفوظ بالبريد أو Teams. من يفتحه يرى ملاحظاتك ويضيف إليها.</li></ol>
   <div class="row"><button class="btn pri" data-a="nsavefile">حفظ الملف مع الملاحظات (${NOTES.length})</button><span class="xs muted">الملف لا يحتاج إنترنت ولا خادمًا؛ الملاحظات داخله.</span></div></div>`}
function vNotes(){const c=k=>NOTES.filter(n=>n.type===k).length,open=NOTES.filter(n=>n.status!=='done').length;
  return `<div class="stack"><div class="sec-title"><h2>ملاحظات المراجعين</h2><span class="en">Reviewer notes · saved in this browser and inside the file</span></div>
  ${STORE_OK?`<div class="note">${IN_FRAME?'تُحفظ ملاحظاتك في هذا المتصفح فقط. لإرسالها استخدم «نسخ كل الملاحظات».':'تُحفظ ملاحظاتك في مكانين: في هذا المتصفح فورًا، وداخل ملف النموذج عند الضغط على «حفظ الملف مع الملاحظات». لا قاعدة بيانات ولا خادم.'}</div>`:'<div class="note bad">التخزين في المتصفح غير متاح هنا (نافذة خاصة أو بيانات مواقع محظورة). احفظ الملف مع الملاحظات قبل إغلاق الصفحة وإلا ضاعت.</div>'}
  ${shareCard()}
  <div class="row"><button class="btn pri" data-a="nadd">أضف ملاحظة</button><span class="sp"></span>
   <button class="btn" data-a="ncopy" ${NOTES.length?'':'disabled'}>نسخ كل الملاحظات</button>
   ${IN_FRAME?'':`<button class="btn" data-a="ndl" data-v="csv" ${NOTES.length?'':'disabled'}>تنزيل Excel (CSV)</button>`}
   <button class="btn" data-a="nimp">${NS.imp?'إغلاق الاستيراد':'دمج ملاحظات من ملف'}</button></div>
  ${NS.copyText!=null?`<div class="card stack"><label class="small b" for="n-copy">تعذر النسخ تلقائيًا. حدّد النص وانسخه:</label><textarea id="n-copy" rows="6" readonly class="search" style="max-width:none">${esc(NS.copyText)}</textarea></div>`:''}
  ${NS.imp?`<div class="card stack"><h3>دمج ملاحظات من ملف</h3><p class="small muted">اختر ملف النموذج (HTML) الذي أرسله مراجع آخر، أو ملف JSON. تُضاف ملاحظاته إلى ملاحظاتك، ويُعتمد الأحدث عند تكرار الملاحظة نفسها. يمكن أيضًا فتح الملف المستلم مباشرة في المتصفح، فتُدمج ملاحظاته تلقائيًا.</p>

   <div class="subtabs" style="margin:0"><button data-a="nst" data-v="all" aria-current="${NS.st==='all'}">كل الحالات</button><button data-a="nst" data-v="open" aria-current="${NS.st==='open'}">مفتوحة (${open})</button><button data-a="nst" data-v="done" aria-current="${NS.st==='done'}">تمت المعالجة (${NOTES.length-open})</button></div></div>
  <div id="nlist">${notesListHtml()}</div></div>`}

/* saving the file with its notes */
const embedJson=()=>JSON.stringify({notes:NOTES,deleted:DELETED,savedAt:new Date().toISOString(),savedBy:getName()}).replace(/</g,'\\u003c');
function fileWithNotes(){return SRC?SRC.replace(EMBED_RE,(m,a,b)=>a+embedJson()+b):null}
function fileName(){const who=(getName()||'').replace(/[\\/:*?"<>|]+/g,'').trim().slice(0,40);return `نموذج منصة مراجعة العقود${who?' - '+who:''} - ${new Date().toISOString().slice(0,10)}.html`}
function markSaved(){FILE_SIG=sigOf(NOTES);render()}
async function saveFile(){const html=fileWithNotes();if(!html){toast('تعذر تجهيز الملف من هذه الصفحة');return}
  if(typeof window.showSaveFilePicker==='function'){try{const h=await window.showSaveFilePicker({suggestedName:fileName(),types:[{description:'صفحة HTML',accept:{'text/html':['.html']}}]});
      const w=await h.createWritable();await w.write(html);await w.close();markSaved();toast('حُفظ الملف مع '+NOTES.length+' ملاحظة');return}
    catch(e){if(e&&e.name==='AbortError')return}}

  if(!list){NS.msg=['bad','لم يُعثر على ملاحظات في الملف.'];return}

  const tab={summary:dSummary,report:dReport,obs:dObs,versions:dVersions,oblig:dOblig,exception:dException,log:()=>timeline(d.timeline.slice().reverse())}[S.dtab]||dSummary;

   <h2 style="font-size:1.35rem">${esc(d.title)}</h2>
   <div class="nextown"><span class="muted">مسؤول الخطوة التالية:</span><b>${esc(nextOwner(demoRow()))}</b><span class="sp"></span><span class="xs muted">آخر تحديث ${d.updated}</span> ${reqs([14])}</div>
   ${actionBar(role)}
   <div class="dtabs" role="tablist">${dt.map(t=>`<button data-a="dtab" data-v="${t[0]}" aria-current="${S.dtab===t[0]}">${t[1]}</button>`).join('')}</div></div>
   <div style="margin-top:14px">${tab(role)}</div>`}
function actionBar(role){const ns=nextStep();const mine=ns&&ns.role===role&&ns.btn&&['detail','review'].includes(ns.view);

    return `<div class="card row"><span class="small b">قرار المختص:</span>${b}${!mine||ns.id!=='approve'?`<button class="btn ${live?'':'dis'}" ${live?'data-a="act" data-v="approve"':'disabled'}>موافقة قانونية</button>`:''}
     <button class="btn" data-a="toast" data-v="في المنصة: يعود الطلب إلى «أعيد للتعديل» وتبدأ جولة تعديل وفحص آلي جديدة" ${live?'':'disabled'}>إعادة للإدارة</button>
     <button class="btn" data-a="toast" data-v="في المنصة: يصبح الطلب «معلّق لحين مستند» ويُشعَر مقدم الطلب بالمستند المطلوب" ${live?'':'disabled'}>تعليق لحين مستند</button>
     <button class="btn danger" data-a="toast" data-v="في المنصة: يُطلب التسبيب إلزاميًا ثم يصبح الطلب «مرفوض»" ${live?'':'disabled'}>رفض مع تسبيب</button><span class="sp"></span>${reqs([45])}</div>`}
  if((role==='req'||role==='deptHead')&&['returned','returned_edit'].includes(D.status)){
    return `<div class="card row"><span class="small">الطلب عندك: راجع الملاحظات، ثم ارفع نسخة معدلة أو اطلب استثناء لملاحظة محددة.</span><span class="sp"></span>${b||'<span class="xs muted">انتقل للخطوة التالية من شريط الرحلة أعلاه</span>'}</div>`}
  return b?`<div class="card row">${b}</div>`:''}
function dSummary(){const d=D;

   <div class="stack"><div class="card stack"><h3>القيمة والتوجيه</h3><dl class="meta">${[['إجمالي القيمة',fmt(d.value)+' ر.س'],['الضريبة',d.vat],['طريقة الاحتساب',d.calc],['المسار',d.route?ROUTE_AR[d.route]:'يُحدد بعد الفحص ومعالجة الملاحظات']].map(m=>`<div><dt>${m[0]}</dt><dd>${esc(m[1])}</dd></div>`).join('')}</dl></div>

const CHECKS=[['قراءة المستندات واستخراج البنود',18],['التكييف القانوني ومطابقة التصنيف',19],['مراجعة نظام الدولة',20],['فحص البنود العامة',21],['فحص البنود المتخصصة',22],['استخراج التزامات الشركة',23],['الغرامات والجزاءات',24],['مقارنة العقد بالمرفقات',25],['تقرير الملاحظات المفصل',26],['تحديد نتيجة الفحص',27]];

  const res={1:['توجد ملاحظات تستلزم تعديلًا','warn'],2:['توجد ملاحظات تستلزم تعديلًا، ورُصدت ملاحظة جديدة أدخلها التعديل','warn'],3:['ملاحظات تستلزم قرار المختص القانوني','plum']}[d.round];
  const cnt=k=>d.obs.filter(o=>o.sev===k).length;

  <ul class="checks">${CHECKS.map((c,i)=>`<li style="animation-delay:${i*90}ms"><span class="ck">✓</span><span style="flex:1">${c[0]}</span>${reqs([c[1]])}</li>`).join('')}</ul>
  <div class="grid g2">
   <div class="card stack"><h4>التكييف القانوني</h4><p class="small">اختارت الإدارة: <b>${esc(d.cat)} › ${esc(d.sub)}</b></p><p class="small">${P('ok','مطابق')} الالتزامات الفعلية إنتاج محتوى ونشر إعلاني. لا يوجد عقد مختلط، فطُبقت مكتبة تسويق وإعلان وحدها.</p></div>
   <div class="card stack"><h4>مراجعة نظام الدولة</h4><p class="small">النظام السعودي: طُبق 3 مراجع معتمدة من المكتبة.</p><p class="small">${P('warn','مرجع غير متوفر')} ضوابط الإفصاح الإعلاني غير مرفوعة؛ ذكر المحرك ذلك صراحة وأحال م-6 للمراجعة البشرية، ولم ينسب أي مادة دون مرجع.</p></div>
   <div class="card stack"><h4>المكتبات المطبقة</h4><p class="small">البنود العامة (الإصدار 1.0): 13 بندًا · البنود الخاصة › تسويق وإعلان (الإصدار 1.0): 5 بنود. الفحص بمعيار القبول، لا بمجرد وجود عنوان البند.</p><p class="xs muted">السياسات المطبقة: الغرامات v0.3 · المخاطر v0.4 · غير القابلة للتجاوز v1.0 · المراجع v1.0 <button class="btn ghost" data-a="goto" data-v="legalDir:libraries:policies">عرض السياسات</button></p></div>
   <div class="card stack"><h4>المستندات</h4><p class="small">4 / 4 مقروءة. تعارض واحد بين العقد والعرض الفني (م-5). لم يُفترض مضمون أي ملحق مفقود.</p></div></div>
  <div class="card row"><span class="small b">الملاحظات حسب الدرجة:</span>${spill('high')}<b class="num">${cnt('high')}</b>${spill('med')}<b class="num">${cnt('med')}</b>${spill('low')}<b class="num">${cnt('low')}</b>${spill('review')}<b class="num">${cnt('review')}</b><span class="sp"></span><button class="btn ghost" data-a="dtab" data-v="obs">عرض الملاحظات والردود</button></div>
  <div class="tw"><table><thead><tr><th>رقم</th><th>النوع</th><th>الموضع</th><th>سبب الخطر</th><th>الدرجة</th><th>المعيار / المرجع</th><th>التوصية</th><th>الحالة</th></tr></thead><tbody>
  ${d.obs.map(o=>`<tr><td class="b">${o.id}${o.isNew?' <span class="pill t-plum">جديدة</span>':''}</td><td class="small">${esc(o.kind)}<div class="xs muted">${esc(o.type)}</div></td><td class="small">${esc(o.clause)}</td><td class="small" style="min-width:240px">${esc(o.reason)}</td><td>${spill(o.sev)}</td><td class="xs" style="min-width:180px">${esc(o.ref)}</td><td class="small">${esc(o.rec)}</td><td>${opill(o.st)}</td></tr>`).join('')}</tbody></table></div>
  <div class="note">عدم وجود ملاحظات لا يساوي موافقة قانونية نهائية: كل العقود تذهب للمراجع القانوني قبل الإغلاق، ولا تصدر أي موافقة من الذكاء الاصطناعي. ${reqs([27,38,45])}</div></div>`}
function dObs(role){const d=D;if(!d.obs.length)return '<div class="empty">تظهر الملاحظات هنا بعد الفحص الآلي</div>';

function obsCard(o,role){const ch=[['done','تمت المعالجة'],['clarify','أطلب توضيحًا'],['exc','أطلب استثناء / تحمل مسؤولية']];

  <div class="ob"><div><span class="lab">الموضع</span>${esc(o.clause)}${o.quote?`<p class="quote small">${esc(o.quote)}</p>`:''}</div><div><span class="lab">سبب الخطر</span><span class="small">${esc(o.reason)}</span></div>
   <div><span class="lab">المعيار / المرجع</span><span class="small">${esc(o.ref)}</span></div><div><span class="lab">التوصية: ${esc(o.rec)} · الصياغة البديلة</span><p class="alt small">${esc(o.alt)}</p></div></div>
  <div class="resp"><div class="row"><span class="xs muted">رد الإدارة الطالبة:</span><div class="choice">${ch.map(c=>`<span class="${o.resp&&o.resp.c===c[0]?'on':''} ${c[0]==='exc'&&!o.waivable?'no':''}" title="${c[0]==='exc'&&!o.waivable?'لا يظهر خيار الاستثناء لملاحظة غير قابلة للتجاوز':''}">${c[1]}</span>`).join('')}</div></div>
   ${o.resp?`<p class="small">${esc(o.resp.t)}${o.resp.f?` <span class="tag">مرفق: ${esc(o.resp.f)}</span>`:''}</p>`:'<p class="xs muted">لم يُرد عليها بعد</p>'}
   ${o.legal?`<p class="small"><span class="xs muted">قرار القانونية:</span> ${esc(o.legal)}</p>`:''}

function dVersions(){const d=D;if(!d.versions.length)return '<div class="empty">تظهر الإصدارات بعد بدء الفحص</div>';

function dOblig(){if(!D.round)return '<div class="empty">تُستخرج الالتزامات بعد الفحص الآلي</div>';
  return `<div class="stack"><p class="small muted">التزامات الشركة مفصولة عن التزامات الطرف الآخر، مع إبراز غير المتوازن أو غير المحدد. ${reqs([23,24])}</p>

function excSteps(stage){const s=[['طلب الإدارة','sign'],['توقيع صاحب الصلاحية','legal'],['قرار القانونية','accepted_cond']];const order=['sign','legal','accepted_cond'];const at=order.indexOf(stage);
  return `<div class="row">${s.map((x,i)=>`${i?'<span class="muted">‹</span>':''}${P(i<at||stage==='accepted_cond'?'ok':i===at?'plum':'neutral',x[0])}`).join('')}</div>`}
function ackForm(d,signable){const e=d.exc;const txt=ACK_TEXT.replace('{الاسم}','فهد القحطاني').replace('{الصفة}','مدير التسويق').replace('{الإدارة}','التسويق').replace('{الملاحظات}',e.obs.join('، ')).replace('{الطلب}',d.id).replace('{الأسباب}',e.reason);

   <dl class="meta">${[['رقم العقد',d.id],['الإدارة الطالبة',d.dept],['صاحب الصلاحية وصفته','فهد القحطاني · مدير التسويق'],['الملاحظات غير المعالجة',e.obs.join('، ')],['القرار المطلوب',e.want],['التاريخ',e.at.slice(0,10)]].map(m=>`<div><dt>${m[0]}</dt><dd>${esc(m[1])}</dd></div>`).join('')}</dl>

   ${e.signedBy?`<p class="small">${P('ok','موقّع')} ${esc(e.signedBy)} · <span class="num">${e.signedAt}</span></p>`:signable?`<div class="row"><button class="btn pri" data-a="act" data-v="sign">أقر وأوقّع إلكترونيًا</button><button class="btn" data-a="toast" data-v="في المنصة: يعود طلب الاستثناء لمقدم الطلب مع ملاحظة صاحب الصلاحية">إعادة لمقدم الطلب</button></div>`:'<p class="xs muted">بانتظار توقيع صاحب الصلاحية. لا يكفي اختيار مربع من مستخدم غير مفوض.</p>'}
   ${e.decidedBy?`<div class="note"><b>قرار القانونية: ${EXC_ST[e.stage].ar}</b> · ${esc(e.decidedBy)} · <span class="num">${e.decidedAt}</span><br>الشرط: ${esc(e.cond)}</div>`:''}

function dException(role){const d=D;
  if(!d.exc){const o=d.obs.filter(x=>['open'].includes(x.st));
    return `<div class="stack"><div class="note">طلب الاستثناء يكون أمام ملاحظة بعينها عندما يرفض الطرف المقابل تعديل البند أو ترغب الإدارة في الإبقاء عليه. لا يُقبل إقرار عام يلغي كل الملاحظات. ${reqs([34,37])}</div>
     ${o.length?`<div class="card stack"><h3>الملاحظات المفتوحة وإمكانية الاستثناء</h3>${o.map(x=>`<div class="row"><b>${x.id}</b><span class="small" style="flex:1">${esc(x.clause)}</span>${x.waivable?P('ok','يمكن طلب استثناء'):P('bad','غير قابلة للتجاوز · تُحال للمختص')}</div>`).join('')}</div>`:''}
     ${(role==='req'||role==='deptHead')&&nextStep()&&nextStep().id==='v3exc'?`<button class="btn pri" data-a="act" data-v="v3exc">رفع النسخة 3 وطلب الاستثناء</button>`:''}</div>`}

function reqTbody(){const rows=reqRows();if(!rows.length)return '<tr><td colspan="5" class="muted">لا توجد بنود مطابقة</td></tr>';
  return rows.map(r=>{const g=REQMAP[r[0]],open=S.open[r[0]];return `<tr class="click reqrow" data-a="rexp" data-v="${r[0]}" tabindex="0" aria-expanded="${!!open}"><td>${r[0]}</td><td><b>${esc(r[1])}</b></td><td class="small">${esc(r[2])}</td><td class="small muted" style="min-width:240px">${esc(r[3].length>110&&!open?r[3].slice(0,110)+'…':'')}</td><td>${g?`<button class="btn ghost" data-a="goto" data-v="${g}">اعرض في النموذج</button>`:''}</td></tr>
   ${open?`<tr class="reqdet"><td></td><td colspan="4"><div class="grid g2"><div><span class="xs muted">متطلبات التنفيذ داخل النظام</span><p class="small">${esc(r[3])}</p></div><div><span class="xs muted">شروط الانتقال والضوابط</span><p class="small">${esc(r[4])}</p></div></div></td></tr>`:''}`}).join('')}
function vRequirements(){return `<div class="stack"><div class="sec-title"><h2>المتطلبات وأين تظهر في النموذج</h2><span class="en">Traceability · all 58 items from the source workbook</span></div>
  <div class="row"><input class="search" id="rq" type="search" placeholder="ابحث في البنود" value="${esc(S.rq)}" aria-label="ابحث في البنود"><div class="subtabs" style="margin:0">${OWNERS.map(o=>`<button data-a="rqo" data-v="${o[0]}" aria-current="${S.rqo===o[0]}">${o[1]}</button>`).join('')}</div></div>
  <div class="tw"><table><thead><tr><th>م</th><th>الإجراء</th><th>المسؤول</th><th>المتطلب (اضغط للتفاصيل)</th><th>في النموذج</th></tr></thead><tbody id="rqb">${reqTbody()}</tbody></table></div></div>`}
function vDecisions(){return `<div class="stack" style="gap:20px"><div class="sec-title"><h2>قرارات مطلوبة من الإدارة القانونية</h2><span class="en">Open decisions found while building the prototype · ${DECISIONS.length}</span></div>
  <p class="lead">نقاط تركها الملف مفتوحة صراحة، أو ظهرت عند تحويل المتطلبات إلى شاشات. لكل نقطة الافتراض الذي يعمل به النموذج الآن، حتى يمكن الحكم عليه في الاجتماع.</p>
  <div class="stack">${DECISIONS.map((x,i)=>`<article class="card dec"><span class="dn">${String(i+1).padStart(2,'0')}</span><div class="stack" style="gap:6px;min-width:0"><div class="row"><h3 style="flex:1;min-width:0">${x.q}</h3>${x.r.length?reqs(x.r):P('warn','مقترح')}<span class="tag">${x.who}</span></div>
   <p class="small muted">${x.why}</p><div class="opt">${x.o.map(o=>`<span>${o}</span>`).join('')}</div><p class="small"><span class="b">افتراض النموذج:</span> ${x.a}</p></div></article>`).join('')}</div>
  <div class="stack"><div class="sec-title"><h2>خطة التشغيل التجريبي</h2><span class="en">Pilot scenarios before rollout · item 56</span></div>
  <div class="tw"><table><thead><tr><th>السيناريو</th><th>المتوقع</th></tr></thead><tbody>${TESTS.map(t=>`<tr><td class="b">${t[0]}</td><td class="small">${t[1]}</td></tr>`).join('')}</tbody></table></div>
  <p class="small muted">لا يُشغَّل المسار النهائي إلا بعد التحقق من دقة التصنيف والتوجيه والملاحظات مقارنةً بالمراجعة البشرية.</p></div></div>`}

/* ---------- navigation ---------- */
const NEED={'deptHead:ack':6,'legalHead:exceptions':7,'legalDir:exceptions':7,'legalHead:distribution':8,'specialist:review':10,'finance:future':11,'ceoGroup:future':11,'ceoSector:future':11,'req:detail:exception':6,'req:detail:versions':5,'req:detail:obs':3,'req:detail:report':2,'req:detail:oblig':2,'req:detail:log':11,'req:notif':2};
function goto(g){S.tour=false;if(g[0]==='@'){S.tab=g.slice(1);setHash();render();window.scrollTo({top:0});return}
  const [role,view,sub]=g.split(':');S.tab='workspace';S.role=role;S.view=view;S.detailId=view==='detail'?DEMO_ID:null;
  if(view==='detail'&&sub)S.dtab=sub;if(view==='libraries'&&sub)S.lib=sub;
  const need=NEED[g]!=null?NEED[g]:NEED[role+':'+view];if(need!=null&&S.k<need)S.k=need;
  setHash();render();window.scrollTo({top:0})}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a,v=el.dataset.v;
  switch(a){
   case 'tab':S.tab=v;setHash();render();window.scrollTo({top:0});break;
   case 'role':S.role=v;S.view=RB[v].views[0][0];S.detailId=null;S.lf='all';render();break;
   case 'view':S.view=v;S.detailId=null;S.lf='all';if(v==='new'&&S.k>=1)S.wz=4;render();break;
   case 'open':S.tab='workspace';S.detailId=v;S.view=(S.role==='specialist'&&v===DEMO_ID&&D.assignee==='خالد الدوسري')?'review':'detail';S.dtab=S.dtab&&v===DEMO_ID?S.dtab:'summary';
     if(RB[S.role].future||S.role==='dt'){S.role='legalDir'}render();window.scrollTo({top:0});break;
   case 'dtab':S.dtab=v;render();break;
   case 'wz':S.wz=Math.max(0,Math.min(4,+v));render();break;
   case 'lib':S.lib=v;render();break;
   case 'lst':S.lst=v;render();break;
   case 'lf':S.lf=v;render();break;
   case 'jnode':S.jsel=S.jsel===+v?null:+v;render();if(S.jsel!=null){const d=$('#jdet');d&&d.scrollIntoView({behavior:'smooth',block:'nearest'})}break;
   case 'goto':goto(v);break;
   case 'tour':goStep(+v,true);break;
   case 'tournext':goStep(S.k+1,true);break;
   case 'tourprev':goStep(S.k-1,true);break;
   case 'tourend':S.tour=false;render();break;
   case 'stepjump':goStep(+v,S.tour);break;
   case 'act':{const ns=nextStep();if(ns&&ns.id===v){goStep(S.k+1,S.tour);toast(ns.done||ns.title)}else toast('هذا الإجراء متاح عندما يصل الطلب إلى مرحلته');break}
   case 'toast':toast(v);break;
   case 'addother':{const n=($('#o-name').value||'').trim(),f=$('#o-file').files&&$('#o-file').files[0];
     if(!n){toast('اكتب اسم المرفق أولًا');$('#o-name').focus();break}if(!f){toast('اختر ملف المرفق');break}
     S.att.other.push(fileTuple(f,n));render();toast('أُضيف «'+n+'» للعرض فقط؛ لا يُحفظ في النموذج');break}
   case 'rmfile':{const [k,i]=v.split(':');if(k==='contract'||k==='quote')S.att[k]=null;else S.att[k].splice(+i,1);render();break}
   case 'reqjump':S.tab='requirements';S.rq='';S.rqo='all';S.open={[v]:true};S.tour=false;setHash();render();{const row=document.querySelector(`[data-a="rexp"][data-v="${v}"]`);row&&row.scrollIntoView({block:'center'})}break;
   case 'rexp':S.open[v]=!S.open[v];$('#rqb').innerHTML=reqTbody();break;
   case 'rqo':S.rqo=v;render();break;
  }});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-a]'))e.target.click()});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='calcV'||id==='calcC'){$('#calcR').innerHTML=calcOut($('#calcV').value,$('#calcC').value)}
  if(id==='rq'){S.rq=e.target.value;$('#rqb').innerHTML=reqTbody()}
  if(id==='f-value'||id==='f-cur'){const v=Number(($('#f-value').value||'').replace(/[^\d.]/g,''))||0,c=$('#f-cur').value;$('#f-sar').textContent=fmt(Math.round(v*(FX[c]||1)))+' ر.س'}
  if(id==='f-country'){const c=COUNTRIES.find(x=>x[0]===e.target.value);$('#f-cnote').textContent=c&&c[3]?c[3]:'لا توجد ملاحظة لهذه الدولة';$('#f-law').value=c?c[2]:''}
  if(id==='f-cat'){const c=CATS.find(x=>x[0]===e.target.value);$('#f-sub').innerHTML=(c?c[1]:[]).map(s=>`<option>${s}</option>`).join('')}
});
document.addEventListener('change',e=>{const id=e.target.id;
  if(['up-contract','up-annex','up-quote'].includes(id)&&e.target.files.length){const fs=[...e.target.files];
    if(id==='up-contract')S.att.contract=fileTuple(fs[0],'مسودة العقد');
    if(id==='up-quote')S.att.quote=fileTuple(fs[0],'عرض السعر');
    if(id==='up-annex')fs.forEach(f=>S.att.annex.push(fileTuple(f,'ملحق العقد')));
    render();toast('أُضيف الملف للعرض فقط؛ لا يُحفظ في النموذج')}
});
(function init(){const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))S.tab=h;render()})();

</script>
